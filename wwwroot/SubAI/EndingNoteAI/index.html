function showMoreFuneral(button){const host=button.closest('.guided-followup');if(!host)return;let panel=host.querySelector('.additional-topics');if(panel){panel.hidden=!panel.hidden;return}const topics=unfinishedFuneralTopics();panel=document.createElement('div');panel.className='additional-topics';panel.innerHTML=topics.length?`<p>아직 정하지 않은 항목만 보여드릴게요.</p>${topics.map(topic=>`<button type="button" data-more-step="${topic.next[0]}">${topic.label}</button>`).join('')}<small>완료한 항목은 웹 App에서 언제든 수정할 수 있어요.</small>`:'<p>추가 장례 항목까지 모두 정리했어요.</p><a class="guide-choice" href="./app.html">웹 App에서 확인·수정</a>';host.append(panel);panel.querySelectorAll('[data-more-step]').forEach(b=>b.onclick=()=>openFuneralTopic(b.dataset.moreStep,b.textContent))}
async function openFuneralTopic(stepId,label){if(busy)return;busy=true;try{const response=await fetch('./api/chat',{method:'POST',headers:{'Content-Type':'application/json','X-SubAI-Request':'1'},body:JSON.stringify({action:'funeral_guidance',stepId,documentId:documentState.documentId,planSummary:planSummary(documentState)})});const data=await response.json();if(!response.ok)throw new Error(data.error||'항목을 열지 못했습니다.');documentState.messages.push({role:'user',text:label,createdAt:new Date().toISOString()},{role:'ai',text:`좋아요. ${label}부터 이어서 정리해 볼게요.`,guidance:data.guidance,createdAt:new Date().toISOString()});persist()}catch(error){documentState.messages.push({role:'ai',text:`이 항목을 열지 못했습니다. 잠시 후 다시 시도해 주세요.\n\n${error.message}`,error:true,createdAt:new Date().toISOString()});persist()}finally{busy=false;render()}}
function showExamples(button){const question=button.dataset.examples,picker=button.closest('.followup').querySelector('.example-picker');picker.hidden=false;picker.innerHTML=`<p>가까운 예시를 골라보세요. 선택한 내용은 나중에 언제든 바꿀 수 있어요.</p><div>${examplesFor(question).map(value=>`<button data-example-value="${escapeHtml(value)}">${escapeHtml(value)}</button>`).join('')}</div><button class="write-own" type="button">직접 말할게요</button>`;picker.querySelectorAll('[data-example-value]').forEach(choice=>choice.onclick=()=>send(`${question} 저는 '${choice.dataset.exampleValue}'로 생각하고 있어요.`));picker.querySelector('.write-own').onclick=()=>{input.placeholder='원하는 내용을 편하게 적어주세요';input.focus()}}
function resolve(candidate,value,status){if(value&&confirmCandidate(documentState,candidate.areaId,candidate.fieldKey,candidate.candidateId,value,status)){candidate.resolved='confirmed';persist();render()}}
function persist(){documentState.updatedAt=new Date().toISOString();store.documents[documentState.documentId]=documentState;saveStore(store);$('save-state').textContent='방금 저장됨'}
function history(){return documentState.messages.filter(m=>!m.loading).slice(-10).map(m=>({role:m.role==='ai'?'assistant':'user',text:m.text}))}
const CHAT_ARCHIVE_PREFIX='subai.chat.archive.v1:';
function archiveConversation(agentId,userId,chatMessages){if(typeof agentId!=='string'||!agentId||typeof userId!=='string'||!userId||!Array.isArray(chatMessages))throw new Error('대화 기록을 보관할 사용자 정보를 확인해 주세요.');const key=`${CHAT_ARCHIVE_PREFIX}${encodeURIComponent(agentId)}:${encodeURIComponent(userId)}`;let archive;try{archive=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(archive))throw new Error()}catch{throw new Error('기존 대화 기록 보관함을 읽지 못했습니다.')}archive.push({archivedAt:new Date().toISOString(),documentId:documentState.documentId,title:documentState.title||'나의 Ending Note',messages:JSON.parse(JSON.stringify(chatMessages))});try{localStorage.setItem(key,JSON.stringify(archive))}catch{throw new Error('대화 기록을 보관하지 못했습니다. 저장 공간을 확인해 주세요.')}}
function chatArchiveUserId(){return sessionStorage.getItem('subai.session.email.v1')||'ending-note-virtual-user'}
function showChatStatus(text,isError=false){const status=$('chat-status');status.textContent=text;status.classList.toggle('error',isError);status.hidden=!text}
function startNewChat(){if(busy){showChatStatus('답변이 끝난 뒤 대화를 초기화해 주세요.',true);return}const previous=structuredClone(documentState.messages),userId=chatArchiveUserId();try{archiveConversation('EndingNoteAI',userId,previous);documentState.messages=[];persist();showChatStatus('현재 대화를 보관하고 대화창을 초기화했습니다. 기존 Ending Note 문서는 유지됩니다.');render();input.focus()}catch(error){documentState.messages=previous;showChatStatus(error.message||'대화 기록을 보관하지 못했습니다.',true);render()}}
document.addEventListener('click',event=>{if(event.target.closest('[data-new-chat]'))startNewChat()});
function requestConsent(text){if(documentState.messages.some(m=>m.consentRequest))return;documentState.messages.push({role:'ai',consentRequest:true,pendingText:text,createdAt:new Date().toISOString()});persist();render()}
function handleConsent(button){const request=documentState.messages.find(m=>m.consentRequest);documentState.messages=documentState.messages.filter(m=>!m.consentRequest);if(button.dataset.consent==='agree'&&request){documentState.consent=true;persist();render();send(request.pendingText)}else{persist();render()}}
async function sendGuidedChoice(button){const text=button.dataset.guidePrompt.trim();if(!text||busy)return;if(!documentState.consent)return requestConsent(text);documentState.messages.push({role:'user',text,createdAt:new Date().toISOString()});busy=true;$('send').disabled=true;persist();render();documentState.messages.push({role:'ai',text:'선택한 내용을 정리하고 있어요…',loading:true});render();try{const response=await fetch('./api/chat',{method:'POST',headers:{'Content-Type':'application/json','X-SubAI-Request':'1'},body:JSON.stringify({action:'guided_choice',stepId:button.dataset.guideStep,choiceId:button.dataset.guideChoice,documentId:documentState.documentId,planSummary:planSummary(documentState)}),signal:AbortSignal.timeout(10000)});const data=await response.json();if(!response.ok)throw new Error(data.error||'선택 내용을 정리하지 못했습니다.');documentState.messages.pop();const ai={role:'ai',text:data.answer,notices:data.notices||[],citations:[],nextQuestion:data.nextQuestion,guidance:data.guidance||null,candidates:data.planCandidates||[],createdAt:new Date().toISOString()};ai.candidates.forEach(c=>addCandidate(documentState,c,text));documentState.messages.push(ai);persist()}catch(error){documentState.messages.pop();documentState.messages.push({role:'ai',text:`선택 내용을 정리하지 못했습니다. 입력 내용은 남아 있습니다.\n\n${error.message}`,error:true});persist()}finally{busy=false;$('send').disabled=false;render();input.focus()}}
async function send(text){text=(text??input.value).trim();if(!text||busy)return;if(!documentState.consent)return requestConsent(text);const previousHistory=history();documentState.messages.push({role:'user',text,createdAt:new Date().toISOString()});input.value='';busy=true;$('send').disabled=true;persist();render();documentState.messages.push({role:'ai',text:'답변을 정리하고 있어요…',loading:true});render();try{const response=await fetch('./api/chat',{method:'POST',headers:{'Content-Type':'application/json','X-SubAI-Request':'1'},body:JSON.stringify({action:'consult',question:text,history:previousHistory,documentId:documentState.documentId,planSummary:planSummary(documentState)}),signal:AbortSignal.timeout(30000)});const data=await response.json();if(!response.ok)throw new Error(data.error||'AI 응답을 받지 못했습니다.');documentState.messages.pop();const ai={role:'ai',text:data.answer,notices:data.notices||[],citations:data.citations||[],nextQuestion:data.nextQuestion,guidance:data.guidance||null,candidates:data.planCandidates||[],costConsult:/장례\s*비용|장례비/.test(text),createdAt:new Date().toISOString()};ai.candidates.forEach(c=>addCandidate(documentState,c,text));documentState.messages.push(ai);persist()}catch(error){documentState.messages.pop();documentState.messages.push({role:'ai',text:`지금은 답변을 불러오지 못했습니다. 입력 내용은 남아 있습니다. 잠시 후 다시 시도해 주세요.\n\n${error.message}`,error:true});persist()}finally{busy=false;$('send').disabled=false;render();input.focus()}}
$('composer').onsubmit=e=>{e.preventDefault();send()};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('open-menu').onclick=()=>sidebar(true);$('close-menu').onclick=$('backdrop').onclick=()=>sidebar(false);$('new-document').onclick=()=>{documentState=createDocument(store);render();sidebar(false);input.focus()};$('show-guide').onclick=()=>send('엔딩노트로 무엇을 할 수 있는지 알려주세요.');window.addEventListener('storage',()=>{store=loadStore();render()});render();
</script></body></html>
