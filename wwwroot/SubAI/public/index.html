<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SubAI · Agent 선택</title>
  <script>
    const pathname = window.location.pathname;
    const basePath = pathname.endsWith("/") ? pathname : `${pathname}/`;
    const stylesheet = document.createElement("link");
    stylesheet.rel = "stylesheet";
    stylesheet.href = new URL(`${basePath}public/chat.css`, window.location.origin).href;
    document.head.append(stylesheet);
    const appModule = document.createElement("script");
    appModule.type = "module";
    appModule.src = new URL(`${basePath}public/hub.js`, window.location.origin).href;
    document.head.append(appModule);
  </script>
</head>
<body>
  <main class="shell">
    <header><div><p class="eyebrow">하나의 서버, 함께 사용하는 AI</p><h1>SubAI</h1></div></header>
    <p>사용하실 Agent를 선택해 주세요. 각 Agent의 대화와 입력 상태는 분리되어 저장됩니다.</p>
    <ul id="agents" class="agents" aria-label="Agent 목록"></ul>
    <p id="status" role="status">목록을 불러오고 있습니다.</p>
  </main>
</body>
</html>
