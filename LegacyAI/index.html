<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>상속증여AI · 세금 계산</title>
  <style>
    :root { font-family: "Segoe UI", "Malgun Gothic", sans-serif; color: #173531; background: #f4f7f5; --accent: #146b59; --line: #dde6e1; --muted: #677b74; }
    * { box-sizing: border-box; }
    body { margin: 0; padding-top: 58px; }
    button, input { font: inherit; }
    button { cursor: pointer; border: 1px solid var(--line); border-radius: 10px; padding: 11px 17px; color: inherit; background: #fff; }
    button:hover { background: #edf5f0; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary:hover { background: #0d5546; }
    button:disabled, input:disabled { cursor: wait; opacity: .65; }
    input { min-width: 0; border: 1px solid #bccfc5; background: #fff; color: inherit; border-radius: 10px; padding: 14px; }
    input:focus, button:focus-visible { outline: 3px solid #8bc6b4; outline-offset: 2px; }
    [hidden] { display: none !important; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 13px; background: var(--accent); color: #fff; font-weight: 700; }
    h1 { font-size: 20px; margin: 0; letter-spacing: -.7px; }
    h2 { margin: 0 0 12px; font-size: 22px; letter-spacing: -.7px; }
    p { line-height: 1.7; }
    .sub { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
    .muted { color: var(--muted); font-size: 13px; }
    .mode-switch { position: fixed; z-index: 1000; top: 8px; left: 50%; display: flex; gap: 4px; padding: 4px; transform: translateX(-50%); border: 1px solid #e7e3e0; border-radius: 13px; background: #faf9f8; box-shadow: 0 2px 12px #17353112; }
    .mode-switch a { display: block; min-width: 68px; padding: 8px 14px; border-radius: 9px; color: #677b74; font-size: 14px; text-align: center; text-decoration: none; white-space: nowrap; }
    .mode-switch a[aria-current="page"] { background: #080808; color: #fff; font-weight: 600; }
    .login-wrap { min-height: calc(100dvh - 58px); display: grid; place-items: center; padding: 24px; }
    .login-card { width: min(100%, 460px); padding: 36px; background: #fff; border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 16px 60px #1c45300a; }
    .login-card .brand { margin-bottom: 38px; }
    .login-card form { display: grid; gap: 12px; margin-top: 26px; }
    label { font-size: 14px; font-weight: 600; }
    .app { max-width: 940px; margin: auto; min-height: calc(100dvh - 58px); background: #fff; display: flex; flex-direction: column; border-inline: 1px solid var(--line); }
    header { padding: 20px 28px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .account { display: flex; align-items: center; gap: 10px; min-width: 0; }
    #email-label { max-width: 220px; overflow-wrap: anywhere; }
    .intro { padding: 22px 28px 8px; }
    .intro p { margin: 0 0 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .actions button { font-size: 13px; padding: 8px 12px; border-radius: 20px; }
    #conversation { flex: 1; padding: 24px 28px 40px; }
    .message { display: flex; gap: 10px; margin: 0 0 22px; }
    .avatar { width: 30px; height: 30px; flex-shrink: 0; display: grid; place-items: center; background: #edf4ef; color: var(--accent); border-radius: 10px; font-size: 12px; font-weight: 700; }
    .bubble { max-width: 88%; background: #f3f6f4; border-radius: 0 14px 14px 14px; padding: 14px 18px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; }
    .message.user { justify-content: flex-end; }
    .user .bubble { background: #e3f0e9; border-radius: 14px 0 14px 14px; }
    .calculator { width: min(100%, 620px); border: 1px solid #cdded4; border-radius: 18px; padding: 24px; background: #fff; box-shadow: 0 6px 24px #17353108; }
    .calculator-closed { padding: 14px 18px; background: #f8faf8; box-shadow: none; }
    .closed-calculator summary { color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 600; }
    .closed-calculator p { margin-bottom: 0; }
    .steps { display: flex; gap: 8px; margin-bottom: 22px; }
    .step { flex: 1; height: 4px; background: #e6ede8; border-radius: 8px; }
    .step.active { background: var(--accent); }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 700; margin: 0 0 9px; }
    .calculator form { display: grid; gap: 14px; }
    .amount-row { display: flex; align-items: center; gap: 10px; }
    .amount-row input { width: 100%; font-variant-numeric: tabular-nums; }
    .amount-row span { flex-shrink: 0; }
    .error { color: #ac3636; font-size: 13px; margin: 0; }
    .radio-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .radio-option { border: 1px solid var(--line); border-radius: 12px; padding: 18px 12px; cursor: pointer; }
    .radio-option:has(input:checked) { border-color: var(--accent); background: #eef7f1; }
    .radio-option input { accent-color: var(--accent); margin-right: 8px; }
    dl { margin: 20px 0; }
    .result-row { display: flex; justify-content: space-between; gap: 16px; margin: 14px 0; font-size: 14px; }
    dt { color: var(--muted); }
    dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .total { border-top: 1px solid var(--line); padding-top: 16px; }
    .tax-total { background: #eaf5ee; padding: 20px; border-radius: 12px; }
    .tax-total strong { display: block; font-size: 30px; letter-spacing: -1px; margin-top: 8px; overflow-wrap: anywhere; }
    .disclaimer { font-size: 12px; line-height: 1.7; color: var(--muted); margin: 18px 0 0; }
    .composer { position: sticky; bottom: 0; padding: 16px 28px; background: #ffffffef; border-top: 1px solid var(--line); }
    .composer form { display: flex; gap: 10px; }
    .composer input { flex: 1; }
    .composer .sub { text-align: center; margin-top: 10px; }
    #storage-status { max-width: 940px; margin: auto; padding: 12px 24px; color: #7a4b13; background: #fff3dd; font-size: 13px; }
    @media (max-width: 600px) {
      header { align-items: flex-start; flex-direction: column; padding: 18px; }
      .account { width: 100%; justify-content: space-between; }
      .intro, #conversation { padding-inline: 16px; }
      .composer { padding: 12px 16px; }
      .calculator { padding: 20px 16px; }
      .message:has(.calculator) .avatar { display: none; }
      .bubble { max-width: 95%; }
      .login-card { padding: 28px; }
      .tax-total strong { font-size: 26px; }
    }
    /* VFAAI 기준: 흰 바탕, 짙은 본문색, 파란 강조색 */
    :root { color: #171717; background: #fff; --accent: #1463dc; --line: #e4e4e4; --muted: #747474; }
    body { background: #fff; }
    button:hover { background: #f5f8ff; }
    input { border-color: #dedede; }
    input:focus, button:focus-visible { outline-color: #1463dc55; }
    .mode-switch { gap: 2px; padding: 4px; border: 0; border-radius: 22px; background: #f2f3f5; box-shadow: none; }
    .mode-switch a { min-width: 74px; padding: 9px 16px; border-radius: 16px; color: #686868; }
    .mode-switch a[aria-current="page"] { background: var(--accent); }
    .app { border-color: var(--line); }
    .avatar { background: #f2f3f5; }
    .bubble { border: 1px solid #ededed; background: #f7f7f8; color: #222; border-radius: 20px; }
    .user .bubble { border-color: #e1eaff; background: #edf3ff; }
    .calculator { border-color: var(--line); }
    .step { background: #e8eaf0; }
    .radio-option:has(input:checked) { background: #f4f7ff; }
    .radio-option input { accent-color: var(--accent); }
    .tax-total { background: #f4f7ff; }
    .tax-total strong { color: var(--accent); }
    .composer { border-color: var(--line); }
    .composer input:focus { outline: none; box-shadow: none; }
  </style>
</head>
<body>
  <nav class="mode-switch" aria-label="화면 전환">
    <a href="./index.html" aria-current="page">AI 채팅</a>
    <a href="./app.html">웹 App</a>
  </nav>
  <div id="storage-status" role="status" hidden></div>
  <main id="login" class="login-wrap">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand"><span class="mark" aria-hidden="true">L</span><div><h1>상속증여AI</h1><p class="sub">나의 자산으로 시작하는 세금 계산</p></div></div>
      <h2 id="login-title">계산을 시작해 볼까요?</h2>
      <p class="muted">이메일을 입력하면 이전 계산을 이어서 확인하실 수 있습니다.</p>
      <form id="login-form">
        <label for="email">이메일</label>
        <input id="email" type="email" placeholder="name@example.com" required maxlength="254" autocomplete="email">
        <p id="login-error" class="error" role="alert"></p>
        <button class="primary" type="submit">확인하고 시작하기</button>
      </form>
      <p class="disclaimer">이메일은 사용자 구분용입니다. 대화와 계산은 이 브라우저에 저장되며, 다른 기기와 공유되지 않습니다.</p>
    </section>
  </main>
  <main id="app" class="app" hidden>
    <header>
      <div class="brand"><span class="mark" aria-hidden="true">L</span><div><h1>상속증여AI</h1><p class="sub">세금 계산 도우미</p></div></div>
      <div class="account"><span id="email-label" class="muted"></span><button id="switch-user" type="button">사용자 변경</button></div>
    </header>
    <section class="intro" aria-label="빠른 실행">
      <p class="muted">원하는 계산을 선택하거나, 아래에 직접 입력해 주세요.</p>
      <div class="actions">
        <button type="button" data-prompt="상속세 계산해줘">상속세 계산</button>
        <button type="button" data-prompt="증여세 계산해줘">증여세 계산</button>
        <button type="button" data-prompt="내 계산결과 보여줘">내 계산결과</button>
      </div>
    </section>
    <section id="conversation" aria-label="대화와 계산"></section>
    <footer class="composer">
      <form id="chat-form">
        <input id="chat-input" aria-label="계산 요청" placeholder="예: 금융자산을 4억으로 바꿔줘" autocomplete="off" maxlength="500" required>
        <button class="primary" type="submit">전송</button>
      </form>
      <p id="chat-status" class="sub" role="status" aria-live="polite">자산 입력 · 단계 이동 · 금액 변경 · 계산결과 조회</p>
    </footer>
  </main>
  <script>
    "use strict";

    // LLM은 서버에서 의도를 판단하고, 검증된 명령만 고정 UI에 적용합니다.
    const MAX_ASSET = 1_000_000_000_000_000;
    const STORE_PREFIX = "legacyai.calculator.v1:";
    const SESSION_EMAIL_KEY = "subai.session.email.v1";
    const sessionChannel = typeof BroadcastChannel === "function" ? new BroadcastChannel("subai.session.v1") : null;
    const WELCOME = "안녕하세요. 상속증여AI 입니다. 상속세/증여세를 계산하거나 입력한 자산을 변경하실 수 있습니다.";
    const won = value => value.toLocaleString("ko-KR") + "원";
    const byId = id => document.getElementById(id);
    let currentEmail = "";
    let user = null;
    let busy = false;

    function initialUser() {
      return { state: { step: 0, realEstate: 0, financial: 0, taxType: "상속세", result: null, realEstateConfirmed: false, financialConfirmed: false }, messages: [{ role: "assistant", text: WELCOME }] };
    }

    function validEmail(value) {
      return typeof value === "string" && value.length <= 254 && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(value);
    }

    function startSession(email, share = true) {
      if (!validEmail(email) || email === currentEmail) return;
      try { if (currentEmail && user) persist(); } catch { /* 이전 사용자 데이터는 화면 전환을 막지 않습니다. */ }
      try { user = loadUser(email); }
      catch {
        byId("login-error").textContent = "저장된 데이터를 읽을 수 없습니다. 다른 이메일을 사용하거나 브라우저 저장 데이터를 확인해 주세요.";
        return;
      }
      currentEmail = email;
      try { sessionStorage.setItem(SESSION_EMAIL_KEY, email); } catch { /* 세션 저장소를 사용할 수 없어도 계산은 계속합니다. */ }
      if (share) sessionChannel?.postMessage({ type: "email", email });
      byId("email").value = email;
      byId("email-label").textContent = email;
      byId("login-error").textContent = "";
      byId("login").hidden = true;
      byId("app").hidden = false;
      ensureCalculatorEntry();
      persist();
      render();
      byId("chat-input").focus();
    }

    function endSession(share = true) {
      if (busy) return;
      if (currentEmail && user) persist();
      try { sessionStorage.removeItem(SESSION_EMAIL_KEY); } catch { /* 세션 저장소를 사용할 수 없어도 화면을 전환합니다. */ }
      if (share) sessionChannel?.postMessage({ type: "logout" });
      currentEmail = "";
      user = null;
      byId("conversation").replaceChildren();
      byId("chat-input").value = "";
      byId("email").value = "";
      byId("email-label").textContent = "";
      byId("login-error").textContent = "";
      byId("app").hidden = true;
      byId("login").hidden = false;
      byId("email").focus();
    }

    function validAsset(value) {
      return Number.isSafeInteger(value) && value >= 0 && value <= MAX_ASSET;
    }

    function calculate(state) {
      if (!validAsset(state.realEstate) || !validAsset(state.financial) || !["상속세", "증여세"].includes(state.taxType)) {
        throw new Error("자산 금액 또는 세목을 확인해 주세요.");
      }
      const total = state.realEstate + state.financial;
      const rate = state.taxType === "상속세"
        ? (total <= 100_000_000 ? 10 : total <= 500_000_000 ? 20 : total <= 1_000_000_000 ? 30 : total <= 3_000_000_000 ? 40 : 50)
        : 12;
      const deduction = state.taxType === "상속세"
        ? (rate === 10 ? 0 : rate === 20 ? 10_000_000 : rate === 30 ? 60_000_000 : rate === 40 ? 160_000_000 : 460_000_000)
        : 0;
      // 상속세는 법정 누진세율과 누진공제를 적용하고, 원 단위는 기존처럼 짝수 반올림합니다.
      const numerator = BigInt(total) * BigInt(rate) - BigInt(deduction) * 100n;
      const quotient = numerator / 100n;
      const remainder = numerator % 100n;
      const rounded = quotient + (remainder > 50n || (remainder === 50n && quotient % 2n === 1n) ? 1n : 0n);
      return { taxType: state.taxType, realEstate: state.realEstate, financial: state.financial, total, rate, tax: Number(rounded) };
    }

    function showStorageMessage(text) {
      byId("storage-status").textContent = text;
      byId("storage-status").hidden = false;
    }

    function persist() {
      try {
        localStorage.setItem(STORE_PREFIX + currentEmail, JSON.stringify(user));
      } catch {
        showStorageMessage("브라우저에 저장하지 못했습니다. 현재 화면에서는 계속 계산할 수 있지만 재접속 시 복원되지 않을 수 있습니다.");
      }
    }

    function loadUser(email) {
      let raw;
      try { raw = localStorage.getItem(STORE_PREFIX + email); }
      catch {
        showStorageMessage("브라우저 저장소를 사용할 수 없습니다. 현재 화면에서만 계산을 유지합니다.");
        return initialUser();
      }
      if (!raw) return initialUser();
      const saved = JSON.parse(raw);
      const state = saved?.state;
      if (!state || !Number.isInteger(state.step) || state.step < 0 || state.step > 4 ||
          !validAsset(state.realEstate) || !validAsset(state.financial) || !["상속세", "증여세"].includes(state.taxType) ||
          !Array.isArray(saved.messages) || !saved.messages.every(m =>
            (["user", "assistant"].includes(m.role) && typeof m.text === "string") ||
            (m.role === "calculator" && typeof m.active === "boolean" && m.state &&
              Number.isInteger(m.state.step) && m.state.step >= 1 && m.state.step <= 4 &&
              validAsset(m.state.realEstate) && validAsset(m.state.financial) && ["상속세", "증여세"].includes(m.state.taxType)))) {
        throw new Error("저장된 계산 데이터 형식을 확인해 주세요.");
      }
      // 이전 단일 HTML 저장 형식의 진행상태도 이어서 사용할 수 있습니다.
      state.realEstateConfirmed = typeof state.realEstateConfirmed === "boolean" ? state.realEstateConfirmed : state.step >= 2;
      state.financialConfirmed = typeof state.financialConfirmed === "boolean" ? state.financialConfirmed : state.step >= 3;
      state.result = state.step === 4 ? calculate(state) : null;
      for (const message of saved.messages) {
        if (message.role === "calculator") message.state.result = message.state.step === 4 ? calculate(message.state) : null;
      }
      return saved;
    }

    function addMessage(role, text) { user.messages.push({ role, text }); }

    function closeCalculatorEntries() {
      for (const message of user.messages) {
        if (message.role === "calculator") message.active = false;
      }
    }

    function openCalculatorEntry() {
      if (!user.state.step) return;
      closeCalculatorEntries();
      user.messages.push({ role: "calculator", state: structuredClone(user.state), active: true });
    }

    function ensureCalculatorEntry() {
      if (user.state.step && !user.messages.some(message => message.role === "calculator")) openCalculatorEntry();
    }

    // 억·천만·백만·만·원 및 쉼표와 소수 금액을 정수 연산으로 해석합니다.
    function parseAmount(raw) {
      let text = raw.replace(/\s/g, "");
      if (!text || text.length > 80) throw new Error("변경할 금액을 숫자로 입력해 주세요. 예: 4억, 40,000만원");
      if (text.endsWith("원")) text = text.slice(0, -1);
      const token = /((?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?)(천만|백만|십만|억|만)?/gy;
      const units = { "억": 100000000n, "천만": 10000000n, "백만": 1000000n, "십만": 100000n, "만": 10000n, "": 1n };
      let position = 0, total = 0n, previousUnit = null;
      while (position < text.length) {
        token.lastIndex = position;
        const match = token.exec(text);
        if (!match) throw new Error("금액 형식을 확인해 주세요. 예: 4억, 1억 5천만원, 40,000만원");
        const unit = units[match[2] || ""];
        if (previousUnit !== null && unit >= previousUnit) throw new Error("금액 단위는 큰 단위부터 입력해 주세요.");
        const [integer, fraction = ""] = match[1].replace(/,/g, "").split(".");
        const denominator = 10n ** BigInt(fraction.length);
        const value = BigInt(integer + fraction) * unit;
        if (value % denominator !== 0n) throw new Error("원보다 작은 금액은 입력할 수 없습니다.");
        total += value / denominator;
        previousUnit = unit;
        position = token.lastIndex;
      }
      if (total > BigInt(MAX_ASSET)) throw new Error("자산별 입력 한도는 1,000조 원입니다.");
      return Number(total);
    }

    function finishCalculation() {
      user.state.result = calculate(user.state);
      user.state.step = 4;
    }

    function applyCommand(command) {
      // LLM 출력은 코드로 실행하지 않고 허용된 명령과 매개변수만 검증해 적용합니다.
      const actions = ["start", "show_step", "update_assets", "show_result", "reply"];
      if (!command || !actions.includes(command.action) || typeof command.message !== "string" ||
          !command.message.trim() || command.message.length > 1500 ||
          ![null, "상속세", "증여세"].includes(command.taxType) || ![null, 1, 2, 3].includes(command.step) ||
          ![command.realEstate, command.financial].every(value => value === null || validAsset(value)) ||
          (command.action !== "update_assets" && (command.realEstate !== null || command.financial !== null)) ||
          (command.action === "show_step" && command.step === null) ||
          (command.action === "start" && ![null, 1].includes(command.step)) ||
          (!["start", "show_step"].includes(command.action) && command.step !== null)) {
        throw new Error("LLM의 제어 명령을 확인하지 못했습니다. 다시 요청해 주세요.");
      }
      const next = structuredClone(user.state);
      let message = command.message;
      const firstMissingStep = () => !next.realEstateConfirmed ? 1 : !next.financialConfirmed ? 2 : 3;
      switch (command.action) {
        case "start":
          user.state = { ...initialUser().state, step: 1, taxType: command.taxType || next.taxType };
          return "계산을 시작하겠습니다. 1단계에서 부동산 자산을 입력해 주세요.";
        case "show_step":
          next.step = command.step;
          next.result = null;
          if (command.taxType) next.taxType = command.taxType;
          message = `${next.step}단계로 이동했습니다. 기존 입력값을 확인해 주세요.`;
          break;
        case "update_assets": {
          if (command.realEstate === null && command.financial === null && command.taxType === null) throw new Error("변경할 항목이 없습니다.");
          const completed = next.step === 4 && next.result !== null;
          if (command.realEstate !== null) next.realEstate = command.realEstate;
          if (command.financial !== null) next.financial = command.financial;
          if (command.taxType !== null) next.taxType = command.taxType;
          if (completed) {
            next.result = calculate(next);
            message = `입력값을 변경하여 재계산했습니다. ${next.taxType}는 ${won(next.result.tax)}입니다.`;
          } else {
            // 계산 중 수정한 값은 해당 단계에서 사용자가 확인하도록 합니다.
            if (command.realEstate !== null) next.realEstateConfirmed = false;
            if (command.financial !== null) next.financialConfirmed = false;
            next.step = command.realEstate !== null ? 1 : command.financial !== null ? 2 : 3;
            next.result = null;
            message = `${next.step}단계에 변경값을 입력했습니다. 아래 확인 버튼을 눌러 주세요.`;
          }
          break;
        }
        case "show_result":
          if (!next.result || next.step !== 4) {
            next.step = firstMissingStep();
            message = `아직 계산이 완료되지 않았습니다. ${next.step}단계 입력을 확인해 주세요.`;
          } else message = `자산 합계 ${won(next.result.total)}에 대한 ${next.taxType}는 ${won(next.result.tax)}입니다.`;
          break;
        case "reply": return message;
      }
      user.state = next;
      return message;
    }

    async function requestCommand(question, history) {
      if (!/^https?:$/.test(location.protocol)) throw new Error("웹사이트의 계산기 주소로 접속해 주세요. 로컬 실행 시 HTML/run.ps1을 실행한 뒤 http://127.0.0.1:5188/SubAI/LegacyAI/ 에 접속합니다.");
      const { step, realEstate, financial, taxType, realEstateConfirmed, financialConfirmed } = user.state;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 75000);
      try {
        const response = await fetch("./api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-LegacyAI-Request": "1" },
          body: JSON.stringify({ question, state: { step, realEstate, financial, taxType, realEstateConfirmed, financialConfirmed }, history }),
          signal: controller.signal
        });
        if (!response.headers.get("content-type")?.includes("application/json")) {
          throw new Error(response.status === 401 || response.status === 403 ? "사이트 로그인 상태 또는 접근 권한을 확인해 주세요." :
            response.status === 429 || response.status === 503 ? "요청이 많습니다. 잠시 후 다시 시도해 주세요." : "계산기 API 응답을 받지 못했습니다. 사이트 연결 또는 로그인 상태를 확인해 주세요.");
        }
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "LLM 요청을 처리하지 못했습니다.");
        return payload;
      } catch (error) {
        if (error.name === "AbortError") throw new Error("응답 시간이 초과되었습니다. 다시 시도해 주세요.");
        if (error instanceof TypeError) throw new Error("계산기 서버에 연결하지 못했습니다. 서버 실행 상태를 확인해 주세요.");
        throw error;
      } finally { clearTimeout(timeout); }
    }

    function setBusy(value) {
      busy = value;
      document.querySelectorAll("#app button, #app input").forEach(node => { node.disabled = value; });
      byId("conversation").setAttribute("aria-busy", String(value));
      byId("chat-status").textContent = value ? "요청을 이해하고 있습니다…" : "자산 입력 · 단계 이동 · 금액 변경 · 계산결과 조회";
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function messageNode(role, text) {
      const row = element("div", "message " + role);
      if (role === "assistant") row.append(element("span", "avatar", "AI"));
      row.append(element("div", "bubble", text));
      return row;
    }

    function renderCalculator(entry) {
      const state = entry.active ? user.state : entry.state;
      const row = element("div", "message assistant");
      row.append(element("span", "avatar", "AI"));
      const card = element("section", "calculator");
      card.setAttribute("aria-label", state.step === 4 ? "계산 결과" : `${state.step}단계 입력`);
      row.append(card);
      if (!entry.active) {
        card.className += " calculator-closed";
        const summary = element("details", "closed-calculator");
        const title = state.step === 4 ? `${state.taxType} 계산 결과 (닫힘)` : `${state.step}단계 입력 화면 (닫힘)`;
        summary.append(element("summary", "", title));
        summary.append(element("p", "muted", `부동산 ${won(state.realEstate)} · 금융 ${won(state.financial)}${state.result ? ` · 산출세액 ${won(state.result.tax)}` : ""}`));
        card.append(summary);
        byId("conversation").append(row);
        return;
      }
      const progress = element("div", "steps");
      progress.setAttribute("aria-hidden", "true");
      for (let i = 1; i <= 3; i++) progress.append(element("span", "step" + (i <= state.step ? " active" : "")));
      card.append(progress);
      if (state.step === 4) {
        const result = state.result;
        card.append(element("p", "eyebrow", "계산 완료"), element("h2", "", `${result.taxType} 계산 결과`));
        const details = element("dl");
        for (const [label, value] of [["부동산 자산", won(result.realEstate)], ["금융 자산", won(result.financial)], ["합산 자산", won(result.total)], ["적용 세율", `${result.rate}%`]]) {
          const line = element("div", "result-row" + (label === "합산 자산" ? " total" : ""));
          line.append(element("dt", "", label), element("dd", "", value));
          details.append(line);
        }
        const total = element("div", "tax-total", `산출 ${result.taxType}`);
        total.append(element("strong", "", won(result.tax)));
        card.append(details, total, element("p", "disclaimer", "상속세는 합산 자산을 과세표준으로 가정해 10~50% 누진세율과 누진공제를 적용하고, 증여세는 합산 자산의 12%로 계산한 단순 시뮬레이션입니다. 공제·채무 등 실제 신고 계산 요소는 반영하지 않습니다."));
        const actions = element("div", "actions");
        actions.style.marginTop = "18px";
        const restart = element("button", "", "새 계산 시작");
        restart.type = "button";
        restart.onclick = () => submitQuestion("새로 계산 시작해줘");
        actions.append(restart);
        card.append(actions, element("p", "muted", "금액을 변경하려면 “금융자산을 4억으로 바꿔줘”라고 입력해 주세요."));
      } else {
        card.append(element("p", "eyebrow", `${state.step} / 3 단계`));
        const title = state.step === 1 ? "부동산 자산 입력" : state.step === 2 ? "금융 자산 입력" : "계산할 세금 선택";
        card.append(element("h2", "", title));
        const form = element("form");
        const error = element("p", "error");
        error.setAttribute("role", "alert");
        if (state.step < 3) {
          const key = state.step === 1 ? "realEstate" : "financial";
          const label = element("label", "", "자산 금액 (만원 단위)");
          label.htmlFor = "asset-amount";
          const inputRow = element("div", "amount-row");
          const input = element("input");
          input.id = "asset-amount";
          input.type = "text";
          input.inputMode = "decimal";
          input.required = true;
          input.autocomplete = "off";
          input.value = String(state[key] / 10000);
          input.maxLength = 24;
          inputRow.append(input, element("span", "muted", "만원"));
          const preview = element("div", "muted", won(state[key]));
          input.oninput = () => {
            try { preview.textContent = won(parseAmount(input.value + "만원")); }
            catch { preview.textContent = "숫자로 금액을 입력해 주세요."; }
          };
          form.append(label, inputRow, preview);
          form.onsubmit = event => {
            event.preventDefault();
            if (busy) return;
            // 단위가 붙은 채팅 금액과 달리 이 입력칸에는 숫자만 받습니다.
            if (!/^(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d{1,4})?$/.test(input.value.trim())) {
              error.textContent = "0 이상의 숫자를 입력해 주세요. 소수점은 최대 4자리까지 가능합니다.";
              return;
            }
            try { state[key] = parseAmount(input.value.trim() + "만원"); }
            catch (failure) { error.textContent = failure.message; return; }
            closeCalculatorEntries();
            state[key + "Confirmed"] = true;
            addMessage("user", `${state.step === 1 ? "부동산" : "금융"} 자산: ${won(state[key])}`);
            state.step += 1;
            state.result = null;
            openCalculatorEntry();
            update();
          };
        } else {
          const options = element("div", "radio-options");
          for (const type of ["상속세", "증여세"]) {
            const label = element("label", "radio-option");
            const radio = element("input");
            radio.type = "radio"; radio.name = "tax-type"; radio.value = type; radio.checked = state.taxType === type;
            radio.onchange = () => { if (!busy) { state.taxType = type; persist(); } };
            label.append(radio, document.createTextNode(type));
            options.append(label);
          }
          form.append(options, element("p", "muted", `자산 합계 ${won(state.realEstate + state.financial)}`));
          form.onsubmit = event => {
            event.preventDefault();
            if (busy) return;
            if (!state.realEstateConfirmed || !state.financialConfirmed) {
              state.step = !state.realEstateConfirmed ? 1 : 2;
              closeCalculatorEntries();
              addMessage("assistant", `${state.step}단계 자산 입력을 먼저 확인해 주세요.`);
              openCalculatorEntry();
              update();
              return;
            }
            finishCalculation();
            closeCalculatorEntries();
            addMessage("assistant", `${state.taxType} 계산이 완료되었습니다. 아래에서 결과를 확인해 주세요.`);
            openCalculatorEntry();
            update();
          };
        }
        const confirm = element("button", "primary", state.step === 3 ? "확인하고 계산하기" : "확인하고 다음 단계");
        confirm.type = "submit";
        form.append(error, confirm);
        card.append(form);
      }
      byId("conversation").append(row);
    }

    function render() {
      const conversation = byId("conversation");
      conversation.replaceChildren();
      for (const message of user.messages) {
        if (message.role === "calculator") renderCalculator(message);
        else conversation.append(messageNode(message.role, message.text));
      }
    }

    function update() {
      ensureCalculatorEntry();
      persist();
      render();
      requestAnimationFrame(() => {
        const latest = byId("conversation").lastElementChild;
        if (latest) latest.scrollIntoView({ block: "start", behavior: "smooth" });
      });
    }

    async function submitQuestion(question) {
      const trimmed = question.trim();
      if (!trimmed || trimmed.length > 500 || !user || busy) return;
      ensureCalculatorEntry();
      closeCalculatorEntries();
      const history = user.messages.filter(message => ["user", "assistant"].includes(message.role) && !message.error).slice(-12).map(message => ({ role: message.role, text: message.text.slice(0, 1000) }));
      addMessage("user", trimmed);
      byId("chat-input").value = "";
      update();
      setBusy(true);
      try {
        const command = await requestCommand(trimmed, history);
        addMessage("assistant", applyCommand(command));
        if (command.action !== "reply") openCalculatorEntry();
      } catch (error) {
        user.messages.push({ role: "assistant", text: error.message + " 입력값은 그대로 유지했습니다.", error: true });
        if (user.state.step) openCalculatorEntry();
        byId("chat-input").value = trimmed;
      } finally {
        update();
        setBusy(false);
        byId("chat-input").focus();
      }
    }

    byId("login-form").onsubmit = event => {
      event.preventDefault();
      const email = byId("email").value.trim().toLowerCase();
      if (!validEmail(email)) {
        byId("login-error").textContent = "올바른 이메일 주소를 입력해 주세요.";
        return;
      }
      startSession(email);
    };
    byId("switch-user").onclick = () => {
      endSession();
    };
    byId("chat-form").onsubmit = event => { event.preventDefault(); submitQuestion(byId("chat-input").value); };
    document.querySelectorAll("[data-prompt]").forEach(button => { button.onclick = () => submitQuestion(button.dataset.prompt); });
    if (sessionChannel) sessionChannel.onmessage = event => {
      const message = event.data;
      if (message?.type === "request") {
        try {
          const saved = sessionStorage.getItem(SESSION_EMAIL_KEY);
          if (validEmail(saved)) sessionChannel.postMessage({ type: "email", email: saved });
        } catch { /* 세션 저장소를 사용할 수 없는 탭은 응답하지 않습니다. */ }
      } else if (message?.type === "email" && validEmail(message.email)) {
        try { sessionStorage.setItem(SESSION_EMAIL_KEY, message.email); } catch { /* 현재 탭에서만 기억합니다. */ }
        if (message.email !== currentEmail) startSession(message.email, false);
      } else if (message?.type === "logout") {
        endSession(false);
      }
    };
    try {
      const rememberedEmail = sessionStorage.getItem(SESSION_EMAIL_KEY);
      if (validEmail(rememberedEmail)) startSession(rememberedEmail);
      else sessionChannel?.postMessage({ type: "request" });
    } catch { /* 세션 저장소를 사용할 수 없으면 이메일을 직접 입력받습니다. */ }
    if (!currentEmail && sessionChannel) sessionChannel.postMessage({ type: "request" });
  </script>
</body>
</html>
